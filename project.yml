name: AlbumCompact
options:
  bundleIdPrefix: com.xiangyang
  # Source language is Chinese; English is the translation. Declaring it here
  # means the String Catalog treats the Chinese literals in the code as keys and
  # Xcode extracts them (with the right format specifiers) on every build.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Set here rather than in Xcode: `xcodegen generate` rewrites the project, so
    # anything picked in the signing UI is wiped on the next regeneration.
    # 向阳 史 (personal team). To use a different one, change this value —
    # it is the OU field of your signing certificate, not the parenthetical in
    # the certificate's name.
    DEVELOPMENT_TEAM: LNP5ER743F
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  AlbumCompact:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AlbumCompact
    info:
      path: AlbumCompact/Resources/Info.plist
      properties:
        CFBundleDisplayName: 相册减负
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        UILaunchScreen:
          UIColorName: ""
        NSPhotoLibraryUsageDescription: >-
          需要读取相册才能找出重复照片与可清理的截图。所有分析都在本机完成，
          不会上传任何照片或数据。
        NSPhotoLibraryAddUsageDescription: >-
          用于把待删除的照片归入一个「待删」相簿，方便你在系统相册里核对。
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.xiangyang.albumcompact.finishScan
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangyang.albumcompact
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
